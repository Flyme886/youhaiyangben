# /etc/nginx/conf.d/harmful-sample.conf
#
# 小程序侧的硬性要求（三条缺一不可）：
#   1. HTTPS，且证书链完整（不能自签名）
#   2. 域名已 ICP 备案
#   3. 不能带端口号，即必须走 443
#
# 同时：FastAPI 只监听 127.0.0.1:8787，永不直接对公网暴露。

upstream harmful_sample_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1 用下面这行；老版本改成 listen 443 ssl http2;
    listen 443 ssl;
    http2 on;

    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 监测 Excel 可能几十 MB，默认 1m 会直接 413
    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/harmful-sample.access.log;
    error_log  /var/log/nginx/harmful-sample.error.log;

    # ---------- 小程序接口：唯一对公网放开的路径 ----------
    location /api/wx/ {
        proxy_pass http://harmful_sample_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 上传 Excel、下载几十 MB 的产物包，默认 60s 不够
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }

    # ---------- 原有 Web 后台：建议只开内网 / VPN ----------
    location / {
        # 放开下面三行即可限制访问来源，公网环境务必启用
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://harmful_sample_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
